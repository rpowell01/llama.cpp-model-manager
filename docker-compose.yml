version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llamaweb
    ports:
      - "5000:5000"
    environment:
      # Model directory (can be overridden to point to external models)
      - MODEL_DIR=/app/models
      # Optional: Prefer Linux llama-server binary in WSL (true/false)
      # - PREFER_LINUX_BINARY=true
      # Optional: Custom llama-server directory
      # - LLAMA_SERVER_DIR=/path/to/llama-server
    volumes:
      # Persistent data directories
      - ./models:/app/models
      - ./logs:/app/logs
      # Mount llama-server binary directory (REQUIRED - see documentation)
      # Example: - /home/user/llama.cpp/bin:/app/llama-server:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ──────────────────────────────────────────────────────────────────────────────
# REQUIRED: llama-server binary
# ──────────────────────────────────────────────────────────────────────────────
# The web UI manages llama-server processes but does NOT include the llama-server
# binary itself. You MUST provide the llama-server binary by mounting it into the
# container.
#
# Option 1: Mount from host (recommended)
#   volumes:
#     - /home/user/llama.cpp/bin:/app/llama-server:ro
#   Then the web UI will auto-detect the binary at /app/llama-server/llama-server
#
# Option 2: Set LLAMA_SERVER_DIR environment variable
#   environment:
#     - LLAMA_SERVER_DIR=/app/llama-server
#
# The binary must be built with KV cache slot save support (--slot-save-path).
# Supported binaries:
#   - Linux: llama-server (SYCL/Vulkan/OpenVINO builds) or llama (with 'serve' subcommand)
#   - Windows: llama-server.exe (runs via Wine in container, not recommended)
#
# ──────────────────────────────────────────────────────────────────────────────
# Optional: Run llama.cpp server alongside the web UI
# ──────────────────────────────────────────────────────────────────────────────
# You can run a llama-server instance in a separate container and connect the
# web UI to it. This is useful for GPU-accelerated inference.
#
# Example (uncomment and configure):
#
# llama-server:
#   image: ghcr.io/ggerganov/llama.cpp:server
#   container_name: llamacpp-server
#   ports:
#     - "8080:8080"
#   volumes:
#     - ./models:/models
#   command: -m /models/your-model.gguf --host 0.0.0.0 --port 8080
#   deploy:
#     resources:
#       reservations:
#         devices:
#           - driver: nvidia
#             count: 1
#             capabilities: [gpu]
#
# Then configure your model in the web UI to use the remote llama-server at
# http://llama-server:8080 (Docker DNS) or http://host.docker.internal:8080
# (from host network mode).