title = "Backend: New API Endpoint /api/benchmark-optimize"
description = """
Create the new Flask endpoint that orchestrates the empirical optimization.

**Tasks:**
1. Add new route in routes/system.py (or new routes/optimize.py):
   - POST /api/benchmark-optimize
   - Request: { model: string, max_duration_sec?: int, target?: 'throughput'|'latency'|'balanced' }
   - Response: { optimal_settings, benchmark_results[], hardware_info, cached: bool, duration_sec: float }
2. Endpoint logic:
   - Validate model exists in registry
   - Get hardware_info via get_hardware_info()
   - Check cache for existing results (BenchmarkOptimizer)
   - If cache miss: run benchmark sweep via BenchmarkOptimizer
   - Return optimal settings in same format as current /api/optimize-settings for compatibility
3. Add request validation and error handling
4. Add logging for benchmark progress (useful for long-running requests)
5. Consider async/background execution for very long benchmarks (future enhancement)
6. Keep existing /api/optimize-settings endpoint for backward compatibility (mark deprecated)

**Acceptance Criteria:**
- Endpoint responds correctly to valid requests
- Returns settings in same format as current optimize-settings
- Includes benchmark_results array with raw metrics for transparency
- Cached responses return quickly (< 1s)
- Non-cached responses complete within max_duration_sec (default 60s)
- Proper error responses for missing model, missing binaries, timeout
- Backward compatible: existing /api/optimize-settings still works

