[[steps]]
id = "emp-opt-1"
title = "Research & Design: Benchmark Parameter Space & API Contract"
description = """
Analyze current optimization logic and define the empirical benchmark approach.

**Tasks:**
1. Study compute_optimal_settings() in routes/system.py - document all settings it computes
2. Analyze llama-bench.exe and llama-batched-bench.exe CLI options and output formats
3. Define the parameter space to explore:
   - GPU layers: [0, 20, 50, 99 (all)] - key variable for GPU offloading
   - Batch size: [256, 512, 1024, 2048, 4096] - prompt processing throughput
   - UBatch size: [128, 256, 512, 1024] - physical batch size
   - Threads: [physical_cores, logical_cores, physical_cores/2] - CPU parallelism
   - Threads_batch: [same as threads, physical_cores]
   - Cache types: [q4_0, q8_0, fp16] - KV cache quantization
   - Flash attention: [on, off, auto]
   - NUMA: [distribute, isolate, off]
   - Speculative decoding: [none, ngram-simple] (for larger models)
4. Define benchmark methodology:
   - llama-bench: measure prompt processing (prefill) and token generation (decode) throughput
   - llama-batched-bench: measure batched inference with varying parallel sequences
   - Run each config 3-5 times, take median to reduce noise
   - Use fixed prompt (512 tokens) and generation (128 tokens) for consistency
5. Design API contract for new endpoint:
   - POST /api/benchmark-optimize { model, max_duration_sec?, configs_to_test? }
   - Response: { optimal_settings, benchmark_results[], hardware_info, cached: bool }
6. Design caching strategy: key = model_name + hardware_fingerprint (GPU model, CPU, RAM)

**Deliverables:**
- Parameter space definition document
- API specification for new endpoint
- Benchmark execution plan (which tools, what parameters, how many runs)
- Cache key design

**Acceptance Criteria:**
- Document covers all settings currently computed by compute_optimal_settings()
- Parameter space is comprehensive but bounded (max ~20-30 config combinations)
- Benchmark duration estimate < 120 seconds for full sweep
- API contract reviewed and approved

