[[steps]]
id = "emp-opt-2"
title = "Backend: Benchmark Runner Module"
description = """
Create a new Python module for executing llama-bench and llama-batched-bench benchmarks.

**Tasks:**
1. Create benchmarks.py module in project root
2. Implement BenchmarkRunner class with:
   - find_bench_binaries(): locate llama-bench.exe and llama-batched-bench.exe from LLAMA_SERVER_DIR
   - run_llama_bench(model_path, config_dict, repetitions=3) -> dict with metrics
   - run_llama_batched_bench(model_path, config_dict, repetitions=3) -> dict with metrics
   - parse_output(output, format='json') -> structured metrics (tokens/sec, latency, memory)
3. Config dict should include all llama.cpp server parameters:
   - n_gpu_layers, batch_size, ubatch_size, threads, threads_batch
   - cache_type_k, cache_type_v, flash_attn, numa, cpu_affinity
   - ctx_size, parallel, spec_type, spec_draft_n_max, etc.
4. Handle subprocess execution with timeout, error capture, resource cleanup
5. Support both Windows (.exe) and Linux binaries
6. Add logging for benchmark progress (start, each run, completion, errors)
7. Unit tests with mocked subprocess calls

**Key Implementation Details:**
- Use subprocess.run() with timeout (configurable, default 30s per run)
- Capture stdout/stderr, parse JSON output (--output json)
- Extract key metrics: pp_avg (prompt processing tokens/sec), tg_avg (token generation tokens/sec)
- For batched bench: extract batch throughput at different parallel levels
- Handle missing binaries gracefully (return error, not crash)
- Run benchmarks in temporary directory to avoid polluting model directory

**Acceptance Criteria:**
- Module imports without errors
- run_llama_bench() executes llama-bench with given config and returns parsed metrics
- run_llama_batched_bench() executes llama-batched-bench and returns parsed metrics
- Handles binary not found, timeout, and execution errors gracefully
- Unit tests pass with mocked subprocess
- Code follows project style (type hints, docstrings, logging)

