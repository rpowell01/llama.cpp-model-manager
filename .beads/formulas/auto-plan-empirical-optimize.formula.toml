[[steps]]
id = "emp-opt-epic"
title = "Refactor Optimize Settings to Empirical Benchmarks"
description = """
Parent epic for refactoring the hardware optimization feature from heuristic-based to empirical benchmark-based.

**Current State:**
- POST /api/optimize-settings calls compute_optimal_settings() which uses hardware detection + heuristics
- Settings are calculated based on CPU count, GPU VRAM, model size estimates
- No actual performance measurement occurs

**Target State:**
- New POST /api/benchmark-optimize endpoint runs llama-bench.exe and llama-batched-bench.exe
- Tests multiple configuration combinations (GPU layers, batch sizes, thread counts, cache types, etc.)
- Returns empirically optimal settings based on measured tokens/sec and latency
- Results cached per model+hardware combination for future use

**Acceptance Criteria:**
1. New benchmark endpoint functional and returns optimal settings
2. Benchmark runs complete within reasonable time (configurable, default ~60-120s)
3. Results are deterministic and reproducible
4. Falls back gracefully if benchmarks fail (use heuristics)
5. Frontend "Optimize Settings" button works with new backend
6. Cache mechanism prevents re-benchmarking same model+hardware
7. All existing tests pass, new tests added for benchmark logic

