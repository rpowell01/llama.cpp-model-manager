[[steps]]
id = "emp-opt-3"
title = "Backend: Benchmark Optimization Engine & Caching"
description = """
Implement the optimization engine that runs benchmark sweeps and selects optimal settings.

**Tasks:**
1. Add BenchmarkOptimizer class to benchmarks.py (or new optimizer.py)
2. Implement generate_config_combinations(hardware_info, model_info) -> List[dict]
   - Use parameter space from emp-opt-1
   - Filter invalid combos (e.g., gpu_layers > 0 but no GPU)
   - Prioritize likely-good configs first for early stopping
3. Implement run_benchmark_sweep(model_path, config_list, max_duration_sec) -> List[result]
   - Run each config through BenchmarkRunner
   - Track elapsed time, stop if exceeding max_duration_sec
   - Return results with metrics and config used
4. Implement select_optimal_config(results, optimization_target='throughput') -> dict
   - optimization_target options: 'throughput' (tokens/sec), 'latency' (ms/token), 'balanced'
   - Score each result, return best config merged with base settings
5. Implement caching layer:
   - Cache key: hash(model_name + model_hash + hardware_fingerprint)
   - Store in ~/.cache/llama-web/benchmarks/ or project-local benchmarks_cache.json
   - Cache entry: { key, optimal_settings, benchmark_results, timestamp, hardware_info }
   - TTL: 30 days or until hardware changes
6. Implement fallback: if benchmark fails or times out, return heuristic settings from compute_optimal_settings()

**Acceptance Criteria:**
- Generates sensible config combinations based on hardware
- Runs sweep within time budget, early exits if needed
- Correctly selects optimal config based on target metric
- Caches results and reuses on subsequent calls
- Falls back to heuristics on any failure
- All functions have unit tests

