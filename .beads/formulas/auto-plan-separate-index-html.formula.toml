**Tasks:**
1. Map all HTML elements by ID, class, and purpose (toolbar, modals, panels, tile grid, log area)
2. Identify all Jinja2 template variables: {{ host }}, {{ flask_port }}, {{ cache_version }}
3. Document all modal structures: download-modal, add-model-form, hf-repo-modal, kilo-config-modal, chat-modal
4. Catalog all JavaScript event listeners and their target elements
5. Identify inline styles that depend on CSS variables
6. Map DOM element relationships (parent-child, references from JS)
7. Identify any dynamic HTML generation (innerHTML, insertAdjacentHTML, etc.)

**Deliverables:**
- Complete dependency map in a new file: `docs/index-html-structure.md`
- List of all DOM element IDs and their purposes
- List of all JS functions that directly manipulate DOM
- Identification of any CSS IDs or classes that must stay global

**Acceptance Criteria:**
- Documentation is comprehensive enough for a developer to understand all pieces
- All DOM IDs and their purposes are listed
