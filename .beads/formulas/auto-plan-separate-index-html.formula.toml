[[steps]]
id = "sep-html-epic"
title = "Refactor index.html into modular components"
description = """
This is the parent epic for separating the monolithic templates/index.html file (2762 lines) into smaller, focused files by purpose and functionality.

The current file contains:
- ~788 lines of embedded CSS with theme support
- ~122 lines of HTML structure with multiple modals
- ~1836 lines of JavaScript with model management, chat, downloads, and Hugging Face integration

**Acceptance Criteria:**
1. All existing functionality preserved (model tiles, properties panel, chat, download progress, theme switching, Kilo Code integration)
2. No regression in UI/UX or performance
3. Code organized into logical, maintainable modules
4. Build/pipeline continues to work (Jinja2 templates load correctly)
5. All event handlers and DOM references remain functional

**Implementation Approach:**
- Extract CSS to dedicated static/css/ file(s)
- Modularize JavaScript by feature area
- Keep HTML templates or convert to SSR components as appropriate
- Maintain backward compatibility with Flask/Jinja2 rendering

**Mandatory Code Review Gate**
Before completing this bead, you MUST invoke the code-reviewer sub-agent.
You must continue fixing issues and re-invoking the code-reviewer until the response is exactly: APPROVED.
"""
priority = "high"
tags = ["refactoring", "frontend", "templates", "code-quality"]
estimates = { total = 16, unit = "hours" }

