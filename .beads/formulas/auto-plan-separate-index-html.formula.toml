[[steps]]
id = "sep-html-css"
title = "Extract and modularize CSS into static/css/"
description = """
Extract all CSS from the <style> block in templates/index.html and organize into manageable, modular CSS files.

**Tasks:**
1. Extract the entire CSS block (lines 11-798) from index.html
2. Analyze CSS structure and categorize:
   - CSS custom properties (variables) - keep in a root theme file
   - Layout styles (grid, flex, positioning)
   - Component styles (buttons, chips, tiles, panels, modals)
   - Theme-specific styles (dark, light, solarized-dark, nord)
   - Responsive media queries
   - Chat-specific styles (tile-embedded vs modal)
3. Create file structure in static/css/:
   - `static/css/variables.css` - CSS custom properties and theme definitions
   - `static/css/components/buttons.css` - All button variants
   - `static/css/components/tiles.css` - Tile grid and tile styles
   - `static/css/components/panels.css` - Properties panel and sections
   - `static/css/components/modals.css` - All modal styles
   - `static/css/components/chat.css` - Chat interface styles (tile + modal)
   - `static/css/layout.css` - Header, toolbar, main content layout
   - `static/css/utils.css` - Utility classes, animations, scrollbars
   - `static/css/responsive.css` - All media queries
   - `static/css/main.css` - Import all above (single import for templates)
4. Replace the embedded <style> block with: `<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ cache_version }}">`
5. Update all CSS to ensure no specificity issues or conflicts
6. Verify all class names and IDs remain unchanged
7. Test theme switching still works with variables in separate file

**Acceptance Criteria:**
- All CSS extracted successfully, zero CSS remaining in HTML file
- CSS modularization maintains same visual appearance (pixel-perfect match)
- Theme switching works correctly
- No FOUC (flash of unstyled content) on page load
- Browser dev tools show separate CSS files with correct paths
- Cache-busting query parameter preserved

**Mandatory Code Review Gate**
Before completing this bead, you MUST invoke the code-reviewer sub-agent.
You must continue fixing issues and re-invoking the code-reviewer until the response is exactly: APPROVED.
"""
priority = "high"
tags = ["css", "frontend", "refactoring", "static"]
estimates = { total = 8, unit = "hours" }
needs = ["sep-html-structure"]

